name: Build Hugo Site

on:
  workflow_call:
    inputs:
      # The base URL on the custom domain of your Cloudflare Pages project
      BASE_URL:
        required: true
        type: string
      # The canonical base URL (only has an effect if it differs from the base URL)
      CANONICAL_BASE_URL:
        required: false
        type: string
      HUGO_VERSION:
        required: true
        type: string
      HUGO_ENVIRONMENT:
        required: true
        type: string
      DART_SASS_VERSION:
        required: true
        type: string
      # Suffix for artifact name to distinguish prod vs debug builds
      # Defaults to HUGO_ENVIRONMENT if not specified
      ARTIFACT_SUFFIX:
        required: false
        type: string
        default: ""
    secrets:
      HUGO_CLARIS_AUTHOR_EMAIL:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Custom environment variables to support theme logic and deployment.
      # Note: BRANCH_NAME is intentionally absent. The branch is a developer-
      # facing identifier (git); system identifiers (cache keys, artifact
      # names) are derived instead — see CACHE_ID below and the artifact-
      # upload step.
      ARTIFACT_PATH: public
      # Default to HUGO_ENVIRONMENT if ARTIFACT_SUFFIX not provided
      ARTIFACT_SUFFIX: ${{ inputs.ARTIFACT_SUFFIX || inputs.HUGO_ENVIRONMENT }}
      HUGO_BASE_URL: ${{ inputs.BASE_URL }}
      HUGO_CANONICAL_BASE_URL: ${{ inputs.CANONICAL_BASE_URL }}
      HUGO_VERSION: ${{ inputs.HUGO_VERSION }}
      HUGO_ENVIRONMENT: ${{ inputs.HUGO_ENVIRONMENT }}
      # For maximum backward compatibility with Hugo modules
      HUGO_ENV: ${{ inputs.HUGO_ENVIRONMENT }}
      HUGO_CACHE_DIR: hugo_cache
      HUGO_CACHE_KEY_PREFIX: hugo_cache
      HUGO_CLARIS_AUTHOR_EMAIL: ${{ secrets.HUGO_CLARIS_AUTHOR_EMAIL }}
      DART_SASS_VERSION: ${{ inputs.DART_SASS_VERSION }}

    steps:
      # Compute HUGO_CACHE_DIR and HUGO_CACHE_KEY. The cache key binds to:
      #   (runner OS, a deterministic hash of the git ref, artifact suffix)
      # Using a hash of the ref keeps the cache key DNS/filesystem-safe for
      # arbitrary branch names (including those with '/'), without restricting
      # what developers can name their branches.
      - name: Set Hugo cache dir and key
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          CACHE_ID=$(printf '%s' "$GIT_REF" | sha1sum | cut -c1-12)
          SUFFIX="$ARTIFACT_SUFFIX"
          CACHE_SUFFIX="${SUFFIX:+-$SUFFIX}"
          {
            printf 'HUGO_CACHE_DIR=%s/%s\n' "$RUNNER_TEMP" "$HUGO_CACHE_DIR"
            printf 'HUGO_CACHE_KEY=%s-%s-%s%s\n' "$HUGO_CACHE_KEY_PREFIX" "$RUNNER_OS" "$CACHE_ID" "$CACHE_SUFFIX"
          } >> "$GITHUB_ENV"

      - name: Debug Hugo cache settings
        run: |
          echo "HUGO_CACHE_DIR=$HUGO_CACHE_DIR"
          echo "HUGO_CACHE_KEY=$HUGO_CACHE_KEY"

      # Install Hugo extended version
      - name: Install Hugo CLI
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"

      # Install Dart Sass for SCSS processing NOTE: Instead of the official Snap
      # method (`sudo snap install dart-sass`), we install from prebuilt
      # binaries to avoid issues indefinite hangs in GitHub-hosted runners.
      - name: Install Dart Sass
        run: |
          curl -LJO https://github.com/sass/dart-sass/releases/download/${{ env.DART_SASS_VERSION }}/dart-sass-${{ env.DART_SASS_VERSION }}-linux-x64.tar.gz
          tar -xf dart-sass-${{ env.DART_SASS_VERSION }}-linux-x64.tar.gz
          sudo cp -r dart-sass/* /usr/local/bin
          sudo chmod +x /usr/local/bin/sass
          rm -rf dart-sass*

      # Checkout project with all submodules for themes or dependencies
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Install Node.js dependencies from whichever lockfile the project uses.
      # Hugo's built-in esbuild resolves bare imports such as `posthog-js` from
      # node_modules, so a skipped install surfaces later as an opaque
      # "Could not resolve" during js.Build rather than as an install failure.
      - name: Install Node.js dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable pnpm
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then
            npm ci
          else
            echo "No lockfile found; skipping Node.js dependency install."
          fi

      # Restore Hugo's internal cache for faster builds (e.g. image processing)
      - name: Restore Hugo cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HUGO_CACHE_DIR }}
          key: ${{ env.HUGO_CACHE_KEY }}-${{ github.run_id }}
          restore-keys: ${{ env.HUGO_CACHE_KEY }}-

      # Check if hugo_stats.json exists (required for Hugo Claris theme)
      - name: Check for hugo_stats.json
        run: |
          if ! [ -f hugo_stats.json ]; then
            echo "Running hugo to create 'hugo_stats.json' as this required file is missing."
            hugo --gc --minify \
              --cacheDir "${{ env.HUGO_CACHE_DIR }}" \
              --baseURL "${{ env.HUGO_BASE_URL }}"
          fi
          if ! [ -f hugo_stats.json ]; then
            echo "Fatal error: Hugo failed to create hugo_stats.json"
            exit 1
          fi

      - name: Check size of Hugo resources after first run
        run: |
          du -sch resources/*/* || true

      - name: Check size of Hugo cache after first run
        run: |
          du -sch "${{ env.HUGO_CACHE_DIR }}"/*/* || true

      # Perform the final build using Hugo
      # For debug builds, skip minification to preserve readability:
      # 1. Don't pass --minify flag to Hugo
      # 2. Set HUGO_CLARIS_MINIFY=false to disable theme-level minification
      - name: Build with Hugo
        run: |
          MINIFY_FLAG=""
          HUGO_CLARIS_MINIFY="true"
          if [ "${{ env.HUGO_ENVIRONMENT }}" = "debug" ]; then
            HUGO_CLARIS_MINIFY="false"
          else
            MINIFY_FLAG="--minify"
          fi
          export HUGO_CLARIS_MINIFY
          hugo --gc $MINIFY_FLAG \
            --cacheDir "${{ env.HUGO_CACHE_DIR }}" \
            --baseURL "${{ env.HUGO_BASE_URL }}"

      - name: Check size of Hugo resources after final run
        run: |
          du -sch resources/*/* || true

      - name: Check size of Hugo cache after final run
        run: |
          du -sch "${{ env.HUGO_CACHE_DIR }}"/*/* || true

      # Upload the built site as an artifact for later deployment.
      # Artifacts are scoped to the workflow run, so the suffix alone
      # (prod/debug) is enough to disambiguate within this run — no branch
      # name needed. Keeping the branch out avoids the artifact-upload
      # action's character restrictions (e.g. '/' is not allowed).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PATH }}-${{ env.ARTIFACT_SUFFIX }}

          # The file, directory or wildcard pattern that describes what to upload
          path: ${{ env.ARTIFACT_PATH }}

          # Consider no files being found using the provided path an error
          # and fail the action with an error message
          if-no-files-found: error

      # Save Hugo cache after build
      #
      # NOTE: for the initial run, we need a fallback key, otherwise the restore
      # step fails
      - name: Debug Hugo cache key
        run: |
          echo "Hugo cache key: ${{ steps.cache-restore.outputs.cache-primary-key }}"
      - name: Save Hugo cache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HUGO_CACHE_DIR }}
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
