name: Deploy to Cloudflare Pages

on:
  workflow_call:
    inputs:
      # The base URL on the custom domain of your Cloudflare Pages project
      BASE_URL:
        required: true
        type: string
      CLOUDFLARE_PROJECT_NAME:
        required: true
        type: string
      # Hugo environment (prod, debug, etc.) - used for artifact suffix default
      HUGO_ENVIRONMENT:
        required: true
        type: string
      # Suffix for artifact name to match the build artifact
      # Defaults to HUGO_ENVIRONMENT if not specified
      ARTIFACT_SUFFIX:
        required: false
        type: string
        default: ""
    secrets:
      # Cloudflare Zone ID is required for manual cache purging
      CLOUDFLARE_ZONE_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # Note: branch name is NOT a job-level env. It's only needed at the
      # wrangler-action step (for Cloudflare's --branch flag), where it is
      # scoped explicitly. System identifiers (cache keys, artifact names)
      # are derived from a hash of the git ref — see CACHE_ID below.
      ARTIFACT_PATH: public
      # Default to HUGO_ENVIRONMENT if ARTIFACT_SUFFIX not provided
      ARTIFACT_SUFFIX: ${{ inputs.ARTIFACT_SUFFIX || inputs.HUGO_ENVIRONMENT }}
      BASE_URL: ${{ inputs.BASE_URL }}
      # Manifest filenames (centralized for maintainability)
      MANIFEST_FILE: public_manifest
      MANIFEST_NEW: public_manifest_new
      MANIFEST_CACHE_KEY_PREFIX: public_manifest

    steps:
      # Compute MANIFEST_CACHE_KEY. Binds to (runner OS, hash of git ref,
      # artifact suffix). Hash-based so the key is DNS/filesystem-safe for
      # arbitrary branch names, without constraining what developers name
      # their branches.
      - name: Set manifest cache key
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          CACHE_ID=$(printf '%s' "$GIT_REF" | sha1sum | cut -c1-12)
          SUFFIX="$ARTIFACT_SUFFIX"
          CACHE_SUFFIX="${SUFFIX:+-$SUFFIX}"
          printf 'MANIFEST_CACHE_KEY=%s-%s-%s%s\n' \
            "$MANIFEST_CACHE_KEY_PREFIX" "$RUNNER_OS" "$CACHE_ID" "$CACHE_SUFFIX" \
            >> "$GITHUB_ENV"

      - name: Debug manifest cache variables
        run: |
          echo "MANIFEST_FILE=$MANIFEST_FILE"
          echo "MANIFEST_CACHE_KEY=$MANIFEST_CACHE_KEY"

      # Artifact name matches the build-hugo.yml upload: per-run scope,
      # disambiguated only by prod/debug suffix.
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PATH }}-${{ env.ARTIFACT_SUFFIX }}
          # Destination path. Supports basic tilde expansion.
          path: ${{ env.ARTIFACT_PATH }}

      # wrangler-action parses `command:` into argv and passes it to wrangler
      # directly (not via a shell), so the interpolation of github.ref_name
      # below is not a shell-injection vector. Branch names flow through
      # untouched — Cloudflare Pages slugifies internally to generate the
      # alias subdomain.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.ARTIFACT_PATH }} --project-name=${{ inputs.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.ref_name }}

      # wrangler-action emits the deployment URLs but nothing consumed them, so
      # the only record of where a build went was the raw job log. Record them as
      # a GitHub Deployment instead: `gh api repos/OWNER/REPO/deployments` then
      # returns every preview URL keyed by branch and commit, with no Cloudflare
      # credential involved. The `deployments: write` permission this job already
      # declares exists for exactly this and was previously unused.
      #
      # An empty deployment-url is tolerated rather than fatal: the site is
      # already deployed by this point, and losing the bookkeeping must not fail
      # a green deploy.
      - name: Record deployment URL
        if: always() && steps.deploy.outcome == 'success'
        # Bookkeeping only. The site is already live by this point, so a
        # failure here must leave the deploy green.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_ID_CF: ${{ steps.deploy.outputs.pages-deployment-id }}
          PROJECT_NAME: ${{ inputs.CLOUDFLARE_PROJECT_NAME }}
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf '### Cloudflare Pages: %s\n\n' "$PROJECT_NAME"
            printf '| Field | Value |\n|---|---|\n'
            printf '| Deployment URL | %s |\n' "${DEPLOYMENT_URL:-(not reported)}"
            printf '| Alias URL | %s |\n' "${DEPLOYMENT_ALIAS_URL:-(none)}"
            printf '| Custom domain | %s |\n' "$BASE_URL"
            printf '| Branch | %s |\n' "$GIT_REF_NAME"
            printf '| Commit | %s |\n' "$GIT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "wrangler reported no deployment URL; skipping GitHub Deployment record."
            exit 0
          fi

          if [ "$GIT_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            IS_PRODUCTION=true
            IS_TRANSIENT=false
          else
            IS_PRODUCTION=false
            IS_TRANSIENT=true
          fi

          DEPLOYMENT_ID=$(
            jq -n \
              --arg ref         "$GIT_SHA" \
              --arg environment "$PROJECT_NAME" \
              --arg description "Cloudflare Pages deploy of ${GIT_REF_NAME}" \
              --arg alias       "${DEPLOYMENT_ALIAS_URL:-}" \
              --arg cf_id       "${DEPLOYMENT_ID_CF:-}" \
              --arg branch      "$GIT_REF_NAME" \
              --argjson production "$IS_PRODUCTION" \
              --argjson transient  "$IS_TRANSIENT" \
              '{
                 ref:                    $ref,
                 environment:            $environment,
                 description:            $description,
                 auto_merge:             false,
                 required_contexts:      [],
                 production_environment: $production,
                 transient_environment:  $transient,
                 payload: {
                   branch:                     $branch,
                   cloudflare_deployment_id:   $cf_id,
                   alias_url:                  $alias
                 }
               }' |
            gh api "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq '.id'
          )

          jq -n \
            --arg state           "success" \
            --arg environment_url "$DEPLOYMENT_URL" \
            --arg log_url         "$RUN_URL" \
            --arg description     "Deployed to ${PROJECT_NAME}" \
            '{
               state:           $state,
               environment_url: $environment_url,
               log_url:         $log_url,
               description:     $description
             }' |
            gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
              --input - --silent

          printf 'Recorded GitHub Deployment %s -> %s\n' "$DEPLOYMENT_ID" "$DEPLOYMENT_URL"

      # Restore previously cached hash manifest to detect changes in content
      - name: Restore previous manifest
        id: restore-manifest
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MANIFEST_FILE }}
          key: ${{ env.MANIFEST_CACHE_KEY }}-${{ github.run_id }}
          restore-keys: ${{ env.MANIFEST_CACHE_KEY }}-

      # Purge modified files from Cloudflare using Python script
      - name: Checkout claris-gh-actions repository
        uses: actions/checkout@v4
        with:
          repository: simonheimlicher/claris-gh-actions
          path: claris-gh-actions

      # Run Python-based purge tool to invalidate only changed URLs on Cloudflare
      - name: Purge modified files from Cloudflare
        run: |
          python3 claris-gh-actions/cloudflare/purge-modified.py \
            --public-dir "${{ env.ARTIFACT_PATH }}" \
            --base-url "${{ env.BASE_URL }}" \
            --zone-id "${{ secrets.CLOUDFLARE_ZONE_ID }}" \
            --api-token "${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --prev-manifest "${{ env.MANIFEST_FILE }}" \
            --save-manifest "${{ env.MANIFEST_NEW }}" \
            --batch-size 30
          # Update manifest to be cached
          mv -f "${{ env.MANIFEST_NEW }}" "${{ env.MANIFEST_FILE }}"

      # Save current hash manifest for comparison in future deploys
      - name: Debug manifest cache key
        run: |
          echo "Manifest cache key: ${{ steps.restore-manifest.outputs.cache-primary-key }}"
      - name: Save current manifest for future deploy
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MANIFEST_FILE }}
          key: ${{ steps.restore-manifest.outputs.cache-primary-key }}
